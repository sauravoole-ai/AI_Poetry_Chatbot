<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Divine Poetry Studio
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

    <div class="bg-animation"></div>

    <div class="particles"></div>

    <div class="container">

        <h1>
            Divine Poetry Studio
        </h1>

        <p class="subtitle">
            Serene AI-generated devotional poetry inspired by sacred moods
        </p>

        <div class="controls">

            <input
                type="text"
                id="topic"
                placeholder="Enter a deity, sacred thought or feeling..."
            >

            <select
                id="rasa"
                onchange="setRasa()"
            >

                <option value="Bhakti">
                    Bhakti • Devotion
                </option>

                <option value="Shanta">
                    Shanta • Peace
                </option>

                <option value="Karuna">
                    Karuna • Compassion
                </option>

                <option value="Veer">
                    Veer • Courage
                </option>

                <option value="Adbhuta">
                    Adbhuta • Wonder
                </option>

            </select>

            <button
                id="generateBtn"
                onclick="generatePoem()"
            >
                ✨ Generate Poem
            </button>

        </div>

        <div class="poem-box">

            <pre id="poem">
Your poem will appear here...
            </pre>

        </div>

        <button
            class="pdf-btn"
            onclick="downloadPDF()"
        >
            📄 Download PDF
        </button>

    </div>

    <script>

        // ---------------- SET RASA ----------------

        async function setRasa(){

            await fetch('/set_rasa', {

                method:'POST',

                headers:{
                    'Content-Type':'application/json'
                },

                body:JSON.stringify({

                    rasa:
                    document.getElementById('rasa').value
                })
            });
        }

        // ---------------- GENERATE ----------------

        async function generatePoem(){

            const topic =
            document.getElementById('topic').value;

            const btn =
            document.getElementById('generateBtn');

            btn.innerText =
            'Composing sacred verses...';

            btn.disabled = true;

            try {

                const response =
                await fetch('/generate', {

                    method:'POST',

                    headers:{
                        'Content-Type':'application/json'
                    },

                    body:JSON.stringify({
                        topic
                    })
                });

                const data =
                await response.json();

                if (!response.ok || !data.poem) {
                    throw new Error(data.error || 'The poetry service is unavailable.');
                }

                typePoem(data.poem);

            } catch (error) {

                document.getElementById('poem').innerHTML =
                'Unable to generate a poem right now. Please try again.';

            } finally {

                btn.innerText =
                '✨ Generate Poem';

                btn.disabled = false;
            }
        }

        // ---------------- POEM REVEAL ----------------

        function typePoem(text){

            const poemBox =
            document.getElementById('poem');

            poemBox.innerHTML = "";

            const lines =
            text.split('\\n');

            lines.forEach((line, index) => {

                setTimeout(() => {

                    const div =
                    document.createElement('div');

                    div.className =
                    'poem-line';

                    div.innerText = line;

                    poemBox.appendChild(div);

                }, index * 650);
            });
        }

        // ---------------- PDF ----------------

        function downloadPDF(){

            window.open('/pdf', '_blank');
        }

        // ---------------- ENTER KEY ----------------

        document
        .getElementById('topic')

        .addEventListener('keypress', function(e){

            if(e.key === 'Enter'){

                generatePoem();
            }
        });

    </script>

</body>
</html>
